name: Job Status Example
on: workflow_dispatch
jobs:
  # 1. 의도적으로 실패하는 Job
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        run: exit 1

  # 2. job1이 성공할 때만 실행
  job2:
    needs: job1
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job1 succeeded"

  # 3. job1이 실패할 때만 실행
  job3:
    needs: job1
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job1 failed"

  # 4. job1의 결과와 관계없이 실행
  job4:
    needs: job1
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Always executed"

