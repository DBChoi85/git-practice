name: Conditional Example
on: workflow_dispatch
jobs:
  conditional:
    runs-on: ubuntu-latest
    steps:
      - name: Show Run ID
        run: echo "Run ID = ${{ github.run_id }}"

      # if를 먼저 작성
      - name: Print Hello
        if: ${{ contains(github.run_id, '1') }}
        run: echo "Hello"

      # run을 먼저 작성
      - name: Print Goodbye
        run: echo "Goodbye"
        if: ${{ !contains(github.run_id, '1') }}

